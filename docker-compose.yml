services:
  db:
    image: postgres:15-alpine
    container_name: thinking_db
    environment:
      POSTGRES_DB: thinking_db
      POSTGRES_USER: thinking_user
      POSTGRES_PASSWORD: thinking_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinking_user -d thinking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: thinking_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://thinking_user:thinking_password@db:5432/thinking_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume: